[project]
name = "interview-coaching-ai"
version = "0.1.0"
description = "AI services for multimodal, explainable interview coaching"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.13.1",
  "httpx==0.28.1",
  "python-multipart==0.0.20"
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]
research = [
  "numpy==2.5.3",
  "pandas==3.0.6",
  "scikit-learn==1.9.1"
]
